<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14a99a"/>
      <stop offset="1" stop-color="#097b6f"/>
    </linearGradient>
  </defs>
  <!-- rounded tile ~23% radius, close to the iOS squircle -->
  <rect width="64" height="64" rx="15" fill="url(#tide)"/>
  <!-- the ✱ mark as real geometry: three rounded bars at 0°, 60°, 120° -->
  <g fill="#f4f7f6">
    <rect x="28.6" y="14" width="6.8" height="36" rx="3.4"/>
    <rect x="28.6" y="14" width="6.8" height="36" rx="3.4" transform="rotate(60 32 32)"/>
    <rect x="28.6" y="14" width="6.8" height="36" rx="3.4" transform="rotate(120 32 32)"/>
  </g>
</svg>
